pre-commit:
  parallel: true
  jobs:
    - name: check formatting of staged files
      glob: "*.{js,jsx,mjs,mts,ts,tsx,json,jsonc,css,md,mdx,yml,yaml}"
      run: pnpm exec oxfmt --check "{staged_files}"
    - name: lint staged files
      glob: "*.{js,jsx,mjs,mts,ts,tsx}"
      run: pnpm exec oxlint "{staged_files}"

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: pnpm typecheck
    - name: test
      run: pnpm test
